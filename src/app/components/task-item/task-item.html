<div class="page">
  <div class="content">
    <h3>{{ task | taskDisplay }}</h3>
    <p class="desc">Leírás: {{ task.description }}</p>
  </div>

  <div class="actions">
    @if (!task.done) {
      <button (click)="onMarkDone()">Kész</button>
    } @else {
      <span class="done-label">Kipipálva!</span>
    }
  </div>
</div>
