<div class="page">
  <h1>Bejelentkezés (opcionális)</h1>
  <input type="text" [(ngModel)]="username" placeholder="Felhasználónév" />
  <br/>
  <button (click)="login()">Bejelentkezés - Tovább a feladatokhoz</button>
  <button (click)="skipLogin()">Tovább a feladatokhoz bejelentkezés nélkül</button>
</div>
